name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        env:
          KEYSTATIC_SKIP: 'true'
          PREVIEW_SITE: 'https://preview.soren.codes'
          REPOSITORY: ${{ github.repository }}
          BRAND_NAME: soren.codes
          BRAND_DESCRIPTION: 'Software engineer & digital explorer'
          BRAND_LOGO: /favicon.svg
          BRAND_TWITTER: ''
          EMAIL_USER: work@soren.codes
          EMAIL_TARGET: work@soren.codes
          RESEND_API_KEY: ci-placeholder
          CAPTCHA_KEY: ci-placeholder
        run: bun run build

  build:
    # deploy job stays main-only; skip it for pull requests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: Production
    runs-on: ubuntu-latest
    steps:
      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: registry.work.soren.codes
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: registry.work.soren.codes/portfolio:latest
          build-args: |
            PREVIEW_SITE=${{ vars.PREVIEW_SITE }}
            REPOSITORY=${{ github.repository }}
            BRAND_NAME=${{ vars.BRAND_NAME }}
            BRAND_DESCRIPTION=${{ vars.BRAND_DESCRIPTION }}
            BRAND_LOGO=${{ vars.BRAND_LOGO }}
            BRAND_TWITTER=${{ vars.BRAND_TWITTER }}
            EMAIL_USER=${{ vars.EMAIL_USER }}
            EMAIL_TARGET=${{ vars.EMAIL_TARGET }}
          secrets: |
            "KEYSTATIC_GITHUB_CLIENT_ID=${{ secrets.KEYSTATIC_GITHUB_CLIENT_ID }}"
            "KEYSTATIC_GITHUB_CLIENT_SECRET=${{ secrets.KEYSTATIC_GITHUB_CLIENT_SECRET }}"
            "KEYSTATIC_SECRET=${{ secrets.KEYSTATIC_SECRET }}"
            "PUBLIC_KEYSTATIC_GITHUB_APP_SLUG=${{ secrets.PUBLIC_KEYSTATIC_GITHUB_APP_SLUG }}"
            "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}"

      - name: Deploy
        uses: distributhor/workflow-webhook@v3
        with:
          webhook_url: ${{ secrets.DEPLOY_WEBHOOK_URL }}
